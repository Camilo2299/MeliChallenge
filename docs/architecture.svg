<text x="1096" y="977" class="body">Raíz de confianza inicial: SSO + Terraform</text>
<text x="1096" y="1000" class="body">Destroy/recreate completo: aún sin ensayo</text>
<text x="1096" y="1023" class="body">Presupuesto USD 80: alerta, no corte</text>
