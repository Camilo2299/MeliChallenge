<text x="546" y="977" class="body">Foundation maintenance: bootstrap / IAM</text>
<text x="546" y="1000" class="body">Roles separados + permissions boundaries</text>
<text x="546" y="1023" class="body">Gates protegidos de production / foundation</text>
