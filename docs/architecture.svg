<text x="56" y="977" class="body">Terraform plan guardado → apply</text>
<text x="56" y="1000" class="body">Smoke autenticado + rollback</text>
<text x="56" y="1023" class="body">Lifecycle: deploy / destroy / reconstruir</text>
