<text x="546" y="757" class="body">On-demand · cifrado · PITR</text>
<text x="546" y="780" class="body">Cada tarea refresca su caché cada 3 s</text>
<text x="546" y="803" class="body">Las peticiones HTTP consultan la caché</text>
