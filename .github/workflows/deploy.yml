name: Verify Plan and Deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Plan and deploy AWS infrastructure (requires configured OIDC roles and approval)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: infra-signal-deployment
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.LAB_AUTODEPLOY_ENABLED == 'true'))
    needs: verify
    runs-on: ubuntu-latest
    environment: image-publish
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
      TF_VAR_image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable image
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$REPOSITORY"
          IMAGE_NAME="${REPOSITORY#*/}"
          if aws ecr describe-images --region "$REGION" --repository-name "$IMAGE_NAME" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Reusing existing immutable image"
          else
            docker build --platform linux/amd64 -t "$REPOSITORY:$GITHUB_SHA" ./api
            docker push "$REPOSITORY:$GITHUB_SHA"
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
  apply:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: 'true'
      DEMO_USER_EMAIL: ${{ vars.DEMO_USER_EMAIL }}
      AUTOMATIC: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - name: Deploy and verify authenticated telemetry
        run: |
          if [ "$AUTOMATIC" = "true" ]; then
            python3 cicd/lifecycle.py deploy --automatic
          else
            python3 cicd/lifecycle.py deploy
          fi
      - name: Reconcile temporary authentication after failure or cancellation
        if: always()
        run: python3 cicd/telemetry_smoke.py --profile '' --cleanup-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-verification
          path: telemetry-smoke.json
          if-no-files-found: ignore
          retention-days: 7
